# GitHub disables scheduled workflows after 60 days without repository
# activity. The baseball off-season is longer than that, and the monitor
# only commits when an offer changes -- so without this it would quietly
# switch itself off and miss opening day.
name: Keepalive

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive"
          git push
